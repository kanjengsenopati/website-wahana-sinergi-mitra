# ==============================================================================
# NGINX CONFIGURATION FOR CV. WAHANA SINERGI MITRA
# Domain: website.wahanasinergimitra.id
# Save to: /etc/nginx/sites-available/website.wahanasinergimitra.id
# Symlink: ln -s /etc/nginx/sites-available/website.wahanasinergimitra.id /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name website.wahanasinergimitra.id;

    # Auto-redirect HTTP to HTTPS (Setelah Certbot dijalankan)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name website.wahanasinergimitra.id;

    # SSL Certificates (Dikelola oleh Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/website.wahanasinergimitra.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/website.wahanasinergimitra.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Web Root & Index
    root /www/wwwroot/website.wahanasinergimitra.id/public;
    index index.php index.html;

    # Charset & Max Upload (Penting untuk upload foto portofolio di Filament)
    charset utf-8;
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets from Vite build
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disable logging for favicon and robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # FastCGI PHP 8.3-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
